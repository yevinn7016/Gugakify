services:
  - type: web
    name: gugakify-ai
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: AI_API_KEY
        generateValue: true
      - key: BACKEND_RESULT_URL
        sync: false
      - key: BACKEND_API_TOKEN
        sync: false

