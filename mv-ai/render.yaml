services:
  - type: web
    name: gugakify-mv-ai
    runtime: python
    rootDir: mv-ai
    plan: standard
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MV_API_KEY
        generateValue: true
      - key: MV_MAX_UPLOAD_BYTES
        value: 52428800
      - key: MV_FFMPEG_PRESET
        value: veryfast
      - key: MV_FFMPEG_CRF
        value: 24
